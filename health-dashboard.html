<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joe Health Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1b1e24;
    --text-dim: #6b7280;
    --accent: #2f6fed;
    --good: #1a9e6b;
    --warn: #d9a017;
    --bad: #d64545;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1e2127;
      --border: #2c303a;
      --text: #e8e9ec;
      --text-dim: #9aa0ac;
      --accent: #5b8dff;
      --good: #34c98a;
      --warn: #e6b53d;
      --bad: #ef5a5a;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 0.9rem; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .card .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card .value {
    font-size: 1.6rem;
    font-weight: 700;
    margin-top: 4px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .card .unit { font-size: 0.85rem; font-weight: 500; color: var(--text-dim); }
  .card .meta { font-size: 0.78rem; margin-top: 6px; color: var(--text-dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.good { background: var(--good); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 16px;
  }
  section.metric {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px 18px;
    box-shadow: var(--shadow);
  }
  .metric-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .metric-head h2 { font-size: 1.05rem; margin: 0; }
  .metric-head .target { font-size: 0.76rem; color: var(--text-dim); }

  form.entry {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    align-items: end;
  }
  form.entry .field { display: flex; flex-direction: column; gap: 4px; }
  form.entry label { font-size: 0.7rem; color: var(--text-dim); }
  form.entry input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    color: var(--text);
    font-size: 0.9rem;
    width: 110px;
  }
  form.entry input[type="date"] { width: 140px; }
  form.entry button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  form.entry button:hover { opacity: 0.9; }

  canvas { max-height: 200px; }

  table.log {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 0.8rem;
  }
  table.log th, table.log td {
    text-align: left;
    padding: 5px 6px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
  }
  table.log th { font-weight: 600; color: var(--text); }
  table.log tr:last-child td { color: var(--text); }
  table.log .del {
    cursor: pointer;
    color: var(--bad);
    font-size: 0.75rem;
    background: none;
    border: none;
    padding: 0;
  }
  details.logwrap { margin-top: 4px; }
  details.logwrap summary {
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--accent);
    user-select: none;
  }
  .empty { color: var(--text-dim); font-size: 0.85rem; padding: 10px 0; }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-top: 32px;
  }
  .export-row {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-bottom: 16px;
  }
  .export-row button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .export-row button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Joe Health Dashboard</h1>
    <div class="sub">Five numbers, tracked over time: Weight, Blood Pressure, Steps, Uric Acid, Sleep. Data is saved locally in this browser.</div>
  </header>

  <div class="export-row">
    <button id="exportBtn">Export data (JSON)</button>
    <button id="importBtn">Import data</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <div class="cards" id="summaryCards"></div>

  <div class="grid" id="metricGrid"></div>

  <footer>Stored only in this browser's local storage. Not a substitute for medical advice.</footer>
</div>

<script>
const METRICS = [
  {
    key: "weight",
    title: "Weight",
    unit: "lb",
    color: "#2f6fed",
    fields: [{ name: "value", label: "Weight (lb)", type: "number", step: "0.1" }],
    target: "Trend toward < 180 lb (7-day average)",
    summarize(entries) {
      if (!entries.length) return null;
      const last7 = entries.slice(-7);
      const avg = last7.reduce((s, e) => s + e.value, 0) / last7.length;
      const latest = entries[entries.length - 1].value;
      const status = avg < 180 ? "good" : avg < 190 ? "warn" : "bad";
      return { display: latest.toFixed(1), meta: `7-day avg: ${avg.toFixed(1)} lb`, status };
    },
    chartValue: e => e.value,
  },
  {
    key: "bp",
    title: "Blood Pressure",
    unit: "mmHg",
    color: "#d64545",
    fields: [
      { name: "systolic", label: "Systolic", type: "number", step: "1" },
      { name: "diastolic", label: "Diastolic", type: "number", step: "1" },
    ],
    target: "Ultimately average < 120/80",
    summarize(entries) {
      if (!entries.length) return null;
      const latest = entries[entries.length - 1];
      const status = latest.systolic < 120 && latest.diastolic < 80 ? "good"
        : latest.systolic < 140 && latest.diastolic < 90 ? "warn" : "bad";
      return { display: `${latest.systolic}/${latest.diastolic}`, meta: `Latest reading`, status };
    },
    chartValue: e => e.systolic,
    chartValue2: e => e.diastolic,
  },
  {
    key: "steps",
    title: "Steps",
    unit: "steps",
    color: "#1a9e6b",
    fields: [{ name: "value", label: "Steps", type: "number", step: "1" }],
    target: "Start 5,000/day, build toward 7,000-8,000",
    summarize(entries) {
      if (!entries.length) return null;
      const latest = entries[entries.length - 1].value;
      const last7 = entries.slice(-7);
      const avg = last7.reduce((s, e) => s + e.value, 0) / last7.length;
      const status = avg >= 7000 ? "good" : avg >= 5000 ? "warn" : "bad";
      return { display: latest.toLocaleString(), meta: `7-day avg: ${Math.round(avg).toLocaleString()}`, status };
    },
    chartValue: e => e.value,
  },
  {
    key: "uric_acid",
    title: "Uric Acid",
    unit: "mg/dL",
    color: "#d9a017",
    fields: [{ name: "value", label: "Uric acid (mg/dL)", type: "number", step: "0.1" }],
    target: "Generally < 6 mg/dL for gout management",
    summarize(entries) {
      if (!entries.length) return null;
      const latest = entries[entries.length - 1];
      const status = latest.value < 6 ? "good" : latest.value < 7 ? "warn" : "bad";
      return { display: latest.value.toFixed(1), meta: `As of ${latest.date}`, status };
    },
    chartValue: e => e.value,
  },
  {
    key: "sleep",
    title: "Sleep",
    unit: "hrs",
    color: "#8a5cf6",
    fields: [{ name: "value", label: "Hours slept", type: "number", step: "0.1" }],
    target: "7-9 hours + consistent sleep-apnea treatment",
    summarize(entries) {
      if (!entries.length) return null;
      const last7 = entries.slice(-7);
      const avg = last7.reduce((s, e) => s + e.value, 0) / last7.length;
      const latest = entries[entries.length - 1].value;
      const status = avg >= 7 ? "good" : avg >= 6 ? "warn" : "bad";
      return { display: latest.toFixed(1), meta: `7-day avg: ${avg.toFixed(1)} hrs`, status };
    },
    chartValue: e => e.value,
  },
];

const STORAGE_KEY = "joe_health_dashboard_v1";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("Could not save to localStorage", e);
  }
}

let data = loadData();
METRICS.forEach(m => { if (!data[m.key]) data[m.key] = []; });

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function addEntry(metricKey, entry) {
  const list = data[metricKey];
  const idx = list.findIndex(e => e.date === entry.date);
  if (idx >= 0) list[idx] = entry; else list.push(entry);
  list.sort((a, b) => a.date.localeCompare(b.date));
  saveData(data);
  renderAll();
}

function deleteEntry(metricKey, date) {
  data[metricKey] = data[metricKey].filter(e => e.date !== date);
  saveData(data);
  renderAll();
}

const charts = {};

function renderSummary() {
  const el = document.getElementById("summaryCards");
  el.innerHTML = "";
  METRICS.forEach(m => {
    const s = m.summarize(data[m.key]);
    const card = document.createElement("div");
    card.className = "card";
    if (!s) {
      card.innerHTML = `<div class="label">${m.title}</div><div class="value" style="color:var(--text-dim);font-size:1rem;">No data yet</div>`;
    } else {
      card.innerHTML = `
        <div class="label"><span>${m.title}</span><span class="dot ${s.status}"></span></div>
        <div class="value">${s.display}<span class="unit">${m.unit}</span></div>
        <div class="meta">${s.meta}</div>
      `;
    }
    el.appendChild(card);
  });
}

function buildForm(m) {
  const form = document.createElement("form");
  form.className = "entry";
  const dateField = document.createElement("div");
  dateField.className = "field";
  dateField.innerHTML = `<label>Date</label><input type="date" name="date" value="${todayStr()}" required>`;
  form.appendChild(dateField);

  m.fields.forEach(f => {
    const wrap = document.createElement("div");
    wrap.className = "field";
    wrap.innerHTML = `<label>${f.label}</label><input type="${f.type}" step="${f.step || 'any'}" name="${f.name}" required>`;
    form.appendChild(wrap);
  });

  const btn = document.createElement("button");
  btn.type = "submit";
  btn.textContent = "Log";
  form.appendChild(btn);

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const fd = new FormData(form);
    const entry = { date: fd.get("date") };
    let valid = true;
    m.fields.forEach(f => {
      const v = parseFloat(fd.get(f.name));
      if (Number.isNaN(v)) valid = false;
      entry[f.name] = v;
    });
    if (!valid || !entry.date) return;
    addEntry(m.key, entry);
    m.fields.forEach(f => form.elements[f.name].value = "");
  });

  return form;
}

function buildLogTable(m) {
  const details = document.createElement("details");
  details.className = "logwrap";
  const entries = data[m.key];
  details.innerHTML = `<summary>View log (${entries.length})</summary>`;
  const table = document.createElement("table");
  table.className = "log";
  const headCols = ["Date", ...m.fields.map(f => f.label), ""];
  table.innerHTML = `<thead><tr>${headCols.map(c => `<th>${c}</th>`).join("")}</tr></thead>`;
  const tbody = document.createElement("tbody");
  [...entries].reverse().forEach(e => {
    const tr = document.createElement("tr");
    const cells = [e.date, ...m.fields.map(f => e[f.name])];
    tr.innerHTML = cells.map(c => `<td>${c}</td>`).join("") + `<td><button class="del" data-date="${e.date}">remove</button></td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  details.appendChild(table);
  details.addEventListener("click", (ev) => {
    if (ev.target.classList.contains("del")) {
      deleteEntry(m.key, ev.target.dataset.date);
    }
  });
  return details;
}

function renderMetricSections() {
  const grid = document.getElementById("metricGrid");
  grid.innerHTML = "";
  METRICS.forEach(m => {
    const section = document.createElement("section");
    section.className = "metric";
    section.innerHTML = `
      <div class="metric-head">
        <h2>${m.title}</h2>
        <div class="target">${m.target}</div>
      </div>
    `;
    section.appendChild(buildForm(m));

    const canvasWrap = document.createElement("div");
    const canvas = document.createElement("canvas");
    canvas.id = `chart-${m.key}`;
    canvasWrap.appendChild(canvas);
    section.appendChild(canvasWrap);

    if (!data[m.key].length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Log your first entry to see a trend.";
      section.appendChild(empty);
    }

    section.appendChild(buildLogTable(m));
    grid.appendChild(section);
  });
}

function renderCharts() {
  if (typeof Chart === "undefined") return;
  METRICS.forEach(m => {
    const canvas = document.getElementById(`chart-${m.key}`);
    if (!canvas) return;
    const entries = data[m.key];
    if (charts[m.key]) { charts[m.key].destroy(); delete charts[m.key]; }
    if (!entries.length) return;

    const labels = entries.map(e => e.date);
    const datasets = [{
      label: m.title,
      data: entries.map(m.chartValue),
      borderColor: m.color,
      backgroundColor: m.color + "33",
      tension: 0.3,
      pointRadius: 3,
      fill: true,
    }];
    if (m.chartValue2) {
      datasets.push({
        label: m.title + " (2)",
        data: entries.map(m.chartValue2),
        borderColor: m.color + "99",
        backgroundColor: "transparent",
        borderDash: [4, 3],
        tension: 0.3,
        pointRadius: 3,
      });
    }

    charts[m.key] = new Chart(canvas, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: !!m.chartValue2 } },
        scales: {
          x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
          y: { beginAtZero: false },
        },
      },
    });
  });
}

function renderAll() {
  renderSummary();
  renderMetricSections();
  renderCharts();
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `health-dashboard-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      METRICS.forEach(m => {
        if (Array.isArray(imported[m.key])) data[m.key] = imported[m.key];
      });
      saveData(data);
      renderAll();
    } catch (e) {
      alert("Could not read that file as valid dashboard data.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
});

renderAll();
</script>
</body>
</html>
