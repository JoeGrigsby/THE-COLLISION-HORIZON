<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joe Health Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #eef1ec;
    --paper: #f7f8f4;
    --panel: #ffffff;
    --border: #d8ded6;
    --border-strong: #c1cabd;
    --text: #1b241f;
    --text-dim: #62705f;
    --text-faint: #8b9788;
    --accent: #2b6e6b;
    --accent-soft: #2b6e6b1a;
    --good: #3f8f5c;
    --good-soft: #3f8f5c1a;
    --warn: #b17c1f;
    --warn-soft: #b17c1f1a;
    --bad: #bd4d3d;
    --bad-soft: #bd4d3d1a;
    --shadow: 0 1px 2px rgba(30,40,32,0.06), 0 4px 14px rgba(30,40,32,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101614;
      --paper: #151d1a;
      --panel: #192221;
      --border: #2a3532;
      --border-strong: #3a4844;
      --text: #e8ede8;
      --text-dim: #93a49b;
      --text-faint: #647169;
      --accent: #62c2ba;
      --accent-soft: #62c2ba22;
      --good: #6bc78d;
      --good-soft: #6bc78d22;
      --warn: #e0b262;
      --warn-soft: #e0b26222;
      --bad: #e28271;
      --bad-soft: #e2827122;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.28);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101614;
    --paper: #151d1a;
    --panel: #192221;
    --border: #2a3532;
    --border-strong: #3a4844;
    --text: #e8ede8;
    --text-dim: #93a49b;
    --text-faint: #647169;
    --accent: #62c2ba;
    --accent-soft: #62c2ba22;
    --good: #6bc78d;
    --good-soft: #6bc78d22;
    --warn: #e0b262;
    --warn-soft: #e0b26222;
    --bad: #e28271;
    --bad-soft: #e2827122;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.28);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 28px 16px 56px;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  h1, h2 { font-family: "Newsreader", Georgia, serif; text-wrap: balance; }

  /* ---------- Masthead ---------- */
  .masthead {
    position: relative;
    background:
      repeating-linear-gradient(to right, transparent, transparent 27px, var(--border) 27px, var(--border) 28px),
      repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--border) 27px, var(--border) 28px),
      var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .masthead::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 55%, var(--bg) 130%);
    pointer-events: none;
  }
  .masthead-row {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  .masthead h1 {
    font-size: clamp(1.5rem, 1.15rem + 1.4vw, 2rem);
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .masthead .sub {
    color: var(--text-dim);
    font-size: 0.92rem;
    max-width: 46ch;
  }
  .chart-meta {
    text-align: right;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--text-faint);
    letter-spacing: 0.03em;
    line-height: 1.6;
  }
  .chart-meta .k { text-transform: uppercase; }
  .chart-meta .v { color: var(--text-dim); }

  .export-row {
    position: relative;
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .export-row button {
    background: var(--panel);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 7px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .export-row button:hover { border-color: var(--accent); color: var(--accent); }
  .export-row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Summary tiles ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px 12px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .card .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-weight: 600;
  }
  .chip {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.65rem;
    letter-spacing: 0.02em;
    padding: 2px 7px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad  { background: var(--bad-soft);  color: var(--bad); }
  .chip.neutral { background: var(--border); color: var(--text-faint); }

  .card .value-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .card .value {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.7rem;
    font-weight: 500;
  }
  .card .unit { font-size: 0.78rem; color: var(--text-faint); }
  .card .delta {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .card .delta.good { color: var(--good); }
  .card .delta.bad { color: var(--bad); }
  .card .delta.flat { color: var(--text-faint); }
  .card .spark { height: 34px; margin-top: 2px; }
  .card .meta { font-size: 0.74rem; color: var(--text-faint); }
  .card.empty .value { color: var(--text-faint); font-size: 0.95rem; font-family: "IBM Plex Sans", sans-serif; }

  /* ---------- Metric detail panels ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 16px;
  }
  section.metric {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px 20px;
    box-shadow: var(--shadow);
  }
  .metric-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .metric-head h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
  }
  .metric .target {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    color: var(--text-faint);
    letter-spacing: 0.01em;
    margin-bottom: 14px;
    padding-left: 10px;
    border-left: 2px solid var(--border-strong);
  }
  .metric .target .k { text-transform: uppercase; color: var(--text-dim); }

  form.entry {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    align-items: end;
  }
  form.entry .field { display: flex; flex-direction: column; gap: 4px; }
  form.entry label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-faint);
  }
  form.entry input {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 7px 9px;
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.88rem;
    width: 108px;
  }
  form.entry input[type="date"] { width: 138px; font-family: "IBM Plex Sans", sans-serif; }
  form.entry input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  form.entry button {
    background: var(--accent);
    color: var(--panel);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  form.entry button:hover { filter: brightness(1.08); }
  form.entry button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chart-wrap { height: 200px; }
  canvas { max-height: 100%; }

  table.log {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem;
  }
  table.log th, table.log td {
    text-align: left;
    padding: 6px 6px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  table.log th {
    font-weight: 600;
    color: var(--text-faint);
    text-transform: uppercase;
    font-size: 0.66rem;
    letter-spacing: 0.03em;
  }
  table.log tr:last-child td { color: var(--text); }
  table.log .del {
    cursor: pointer;
    color: var(--bad);
    font-size: 0.72rem;
    background: none;
    border: none;
    padding: 0;
    font-family: "IBM Plex Sans", sans-serif;
  }
  table.log .del:hover { text-decoration: underline; }
  .table-scroll { overflow-x: auto; }

  details.logwrap { margin-top: 2px; }
  details.logwrap summary {
    cursor: pointer;
    font-size: 0.76rem;
    color: var(--accent);
    user-select: none;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  details.logwrap summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty-state {
    color: var(--text-faint);
    font-size: 0.85rem;
    padding: 8px 0 4px;
  }

  footer {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.74rem;
    margin-top: 30px;
  }

  @media (max-width: 480px) {
    .masthead-row { flex-direction: column; align-items: flex-start; }
    .chart-meta { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="masthead-row">
      <div>
        <h1>Joe Health Dashboard</h1>
        <div class="sub">Five numbers, tracked over time — weight, blood pressure, steps, uric acid, sleep — kept simple enough to check daily.</div>
      </div>
      <div class="chart-meta" id="chartMeta"></div>
    </div>
    <div class="export-row">
      <button id="exportBtn" type="button">Export log</button>
      <button id="importBtn" type="button">Import log</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </div>

  <div class="cards" id="summaryCards"></div>

  <div class="grid" id="metricGrid"></div>

  <footer>Stored only in this browser's local storage. Not a substitute for medical advice.</footer>
</div>

<script>
const METRICS = [
  {
    key: "weight",
    title: "Weight",
    unit: "lb",
    color: "#2b6e6b",
    fields: [{ name: "value", label: "Weight (lb)", type: "number", step: "0.1" }],
    target: "Trend toward &lt; 180 lb, 7-day average",
    lowerIsBetter: true,
    summarize(entries) {
      if (!entries.length) return null;
      const last7 = entries.slice(-7);
      const avg = last7.reduce((s, e) => s + e.value, 0) / last7.length;
      const latest = entries[entries.length - 1].value;
      const status = avg < 180 ? "good" : avg < 190 ? "warn" : "bad";
      return { display: latest.toFixed(1), meta: `7-day avg ${avg.toFixed(1)} lb`, status };
    },
    chartValue: e => e.value,
  },
  {
    key: "bp",
    title: "Blood Pressure",
    unit: "mmHg",
    color: "#bd4d3d",
    fields: [
      { name: "systolic", label: "Systolic", type: "number", step: "1" },
      { name: "diastolic", label: "Diastolic", type: "number", step: "1" },
    ],
    target: "Ultimately average &lt; 120/80",
    lowerIsBetter: true,
    summarize(entries) {
      if (!entries.length) return null;
      const latest = entries[entries.length - 1];
      const status = latest.systolic < 120 && latest.diastolic < 80 ? "good"
        : latest.systolic < 140 && latest.diastolic < 90 ? "warn" : "bad";
      return { display: `${latest.systolic}/${latest.diastolic}`, meta: `Latest reading`, status };
    },
    chartValue: e => e.systolic,
    chartValue2: e => e.diastolic,
    deltaValue: e => e.systolic,
  },
  {
    key: "steps",
    title: "Steps",
    unit: "steps",
    color: "#3f8f5c",
    fields: [{ name: "value", label: "Steps", type: "number", step: "1" }],
    target: "Start 5,000/day, build toward 7,000–8,000",
    lowerIsBetter: false,
    summarize(entries) {
      if (!entries.length) return null;
      const latest = entries[entries.length - 1].value;
      const last7 = entries.slice(-7);
      const avg = last7.reduce((s, e) => s + e.value, 0) / last7.length;
      const status = avg >= 7000 ? "good" : avg >= 5000 ? "warn" : "bad";
      return { display: latest.toLocaleString(), meta: `7-day avg ${Math.round(avg).toLocaleString()}`, status };
    },
    chartValue: e => e.value,
  },
  {
    key: "uric_acid",
    title: "Uric Acid",
    unit: "mg/dL",
    color: "#b17c1f",
    fields: [{ name: "value", label: "Uric acid (mg/dL)", type: "number", step: "0.1" }],
    target: "Generally &lt; 6 mg/dL for gout management",
    lowerIsBetter: true,
    summarize(entries) {
      if (!entries.length) return null;
      const latest = entries[entries.length - 1];
      const status = latest.value < 6 ? "good" : latest.value < 7 ? "warn" : "bad";
      return { display: latest.value.toFixed(1), meta: `Lab result, ${latest.date}`, status };
    },
    chartValue: e => e.value,
  },
  {
    key: "sleep",
    title: "Sleep",
    unit: "hrs",
    color: "#6a5fc7",
    fields: [{ name: "value", label: "Hours slept", type: "number", step: "0.1" }],
    target: "7–9 hours, consistent apnea treatment",
    lowerIsBetter: false,
    summarize(entries) {
      if (!entries.length) return null;
      const last7 = entries.slice(-7);
      const avg = last7.reduce((s, e) => s + e.value, 0) / last7.length;
      const latest = entries[entries.length - 1].value;
      const status = avg >= 7 ? "good" : avg >= 6 ? "warn" : "bad";
      return { display: latest.toFixed(1), meta: `7-day avg ${avg.toFixed(1)} hrs`, status };
    },
    chartValue: e => e.value,
  },
];

const STATUS_LABEL = { good: "On track", warn: "Watch", bad: "Attention" };

const STORAGE_KEY = "joe_health_dashboard_v1";

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("Could not save to localStorage", e);
  }
}

let data = loadData();
METRICS.forEach(m => { if (!data[m.key]) data[m.key] = []; });

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function addEntry(metricKey, entry) {
  const list = data[metricKey];
  const idx = list.findIndex(e => e.date === entry.date);
  if (idx >= 0) list[idx] = entry; else list.push(entry);
  list.sort((a, b) => a.date.localeCompare(b.date));
  saveData(data);
  renderAll();
}

function deleteEntry(metricKey, date) {
  data[metricKey] = data[metricKey].filter(e => e.date !== date);
  saveData(data);
  renderAll();
}

const charts = {};
const sparks = {};

function renderChartMeta() {
  const el = document.getElementById("chartMeta");
  const allDates = METRICS.flatMap(m => data[m.key].map(e => e.date));
  const totalEntries = allDates.length;
  const since = allDates.length ? allDates.sort()[0] : todayStr();
  el.innerHTML = `
    <div><span class="k">Log started</span> <span class="v">${since}</span></div>
    <div><span class="k">Entries</span> <span class="v">${totalEntries}</span></div>
  `;
}

function computeDelta(m, entries) {
  const valueFn = m.deltaValue || m.chartValue;
  if (entries.length < 2) return null;
  const diff = valueFn(entries[entries.length - 1]) - valueFn(entries[entries.length - 2]);
  if (Math.abs(diff) < 1e-9) return { diff: 0, cls: "flat", sign: "–" };
  const improving = m.lowerIsBetter ? diff < 0 : diff > 0;
  const arrow = diff > 0 ? "▲" : "▼";
  return { diff, cls: improving ? "good" : "bad", sign: arrow };
}

function renderSummary() {
  const el = document.getElementById("summaryCards");
  el.innerHTML = "";
  METRICS.forEach(m => {
    const entries = data[m.key];
    const s = m.summarize(entries);
    const card = document.createElement("div");
    card.className = "card" + (s ? "" : " empty");
    if (!s) {
      card.innerHTML = `
        <div class="label-row"><span class="label">${m.title}</span><span class="chip neutral">No data</span></div>
        <div class="value-row"><span class="value">Log first entry</span></div>
      `;
    } else {
      const delta = computeDelta(m, entries);
      const deltaHtml = delta
        ? `<span class="delta ${delta.cls}">${delta.sign} ${Math.abs(delta.diff).toFixed(delta.diff % 1 === 0 ? 0 : 1)}</span>`
        : "";
      card.innerHTML = `
        <div class="label-row">
          <span class="label">${m.title}</span>
          <span class="chip ${s.status}">${STATUS_LABEL[s.status]}</span>
        </div>
        <div class="value-row">
          <span class="value">${s.display}</span>
          <span class="unit">${m.unit}</span>
          ${deltaHtml}
        </div>
        <canvas class="spark" id="spark-${m.key}"></canvas>
        <div class="meta">${s.meta}</div>
      `;
    }
    el.appendChild(card);
  });
}

function buildForm(m) {
  const form = document.createElement("form");
  form.className = "entry";
  const dateField = document.createElement("div");
  dateField.className = "field";
  const dateId = `date-${m.key}`;
  dateField.innerHTML = `<label for="${dateId}">Date</label><input id="${dateId}" type="date" name="date" value="${todayStr()}" required>`;
  form.appendChild(dateField);

  m.fields.forEach(f => {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const id = `${f.name}-${m.key}`;
    wrap.innerHTML = `<label for="${id}">${f.label}</label><input id="${id}" type="${f.type}" step="${f.step || 'any'}" name="${f.name}" required>`;
    form.appendChild(wrap);
  });

  const btn = document.createElement("button");
  btn.type = "submit";
  btn.textContent = "Log";
  form.appendChild(btn);

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const fd = new FormData(form);
    const entry = { date: fd.get("date") };
    let valid = true;
    m.fields.forEach(f => {
      const v = parseFloat(fd.get(f.name));
      if (Number.isNaN(v)) valid = false;
      entry[f.name] = v;
    });
    if (!valid || !entry.date) return;
    addEntry(m.key, entry);
    m.fields.forEach(f => form.elements[f.name].value = "");
  });

  return form;
}

function buildLogTable(m) {
  const details = document.createElement("details");
  details.className = "logwrap";
  const entries = data[m.key];
  details.innerHTML = `<summary>View log (${entries.length})</summary>`;
  const scroll = document.createElement("div");
  scroll.className = "table-scroll";
  const table = document.createElement("table");
  table.className = "log";
  const headCols = ["Date", ...m.fields.map(f => f.label), ""];
  table.innerHTML = `<thead><tr>${headCols.map(c => `<th>${c}</th>`).join("")}</tr></thead>`;
  const tbody = document.createElement("tbody");
  [...entries].reverse().forEach(e => {
    const tr = document.createElement("tr");
    const cells = [e.date, ...m.fields.map(f => e[f.name])];
    tr.innerHTML = cells.map(c => `<td>${c}</td>`).join("") + `<td><button class="del" data-date="${e.date}">remove</button></td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  details.appendChild(scroll);
  details.addEventListener("click", (ev) => {
    if (ev.target.classList.contains("del")) {
      deleteEntry(m.key, ev.target.dataset.date);
    }
  });
  return details;
}

function renderMetricSections() {
  const grid = document.getElementById("metricGrid");
  grid.innerHTML = "";
  METRICS.forEach(m => {
    const section = document.createElement("section");
    section.className = "metric";
    section.innerHTML = `
      <div class="metric-head"><h2>${m.title}</h2></div>
      <div class="target"><span class="k">Target</span> · ${m.target}</div>
    `;
    section.appendChild(buildForm(m));

    const canvasWrap = document.createElement("div");
    canvasWrap.className = "chart-wrap";
    const canvas = document.createElement("canvas");
    canvas.id = `chart-${m.key}`;
    canvasWrap.appendChild(canvas);
    section.appendChild(canvasWrap);

    if (!data[m.key].length) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Log your first entry to see a trend line here.";
      section.appendChild(empty);
    }

    section.appendChild(buildLogTable(m));
    grid.appendChild(section);
  });
}

function destroyChart(store, key) {
  if (store[key]) { store[key].destroy(); delete store[key]; }
}

function renderCharts() {
  if (typeof Chart === "undefined") return;
  const gridColor = cssVar("--border");
  const textColor = cssVar("--text-faint");

  METRICS.forEach(m => {
    const canvas = document.getElementById(`chart-${m.key}`);
    destroyChart(charts, m.key);
    if (!canvas) return;
    const entries = data[m.key];
    if (!entries.length) return;

    const labels = entries.map(e => e.date);
    const n = entries.length;
    const ptRadius = (i) => (i === n - 1 ? 5 : 2.5);

    const datasets = [{
      label: m.title,
      data: entries.map(m.chartValue),
      borderColor: m.color,
      backgroundColor: m.color + "26",
      tension: 0.3,
      pointRadius: entries.map((_, i) => ptRadius(i)),
      pointBackgroundColor: m.color,
      pointBorderColor: m.color,
      borderWidth: 2,
      fill: true,
    }];
    if (m.chartValue2) {
      datasets.push({
        label: m.title + " (diastolic)",
        data: entries.map(m.chartValue2),
        borderColor: m.color + "99",
        backgroundColor: "transparent",
        borderDash: [4, 3],
        tension: 0.3,
        pointRadius: entries.map((_, i) => ptRadius(i) - 1),
        borderWidth: 2,
      });
    }

    charts[m.key] = new Chart(canvas, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { intersect: false, mode: "index" },
        plugins: {
          legend: { display: !!m.chartValue2, labels: { color: textColor, boxWidth: 12, font: { family: "IBM Plex Sans", size: 11 } } },
        },
        scales: {
          x: {
            ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 6, color: textColor, font: { family: "IBM Plex Mono", size: 10 } },
            grid: { color: gridColor },
          },
          y: {
            beginAtZero: false,
            ticks: { color: textColor, font: { family: "IBM Plex Mono", size: 10 } },
            grid: { color: gridColor },
          },
        },
      },
    });
  });
}

function renderSparklines() {
  if (typeof Chart === "undefined") return;
  METRICS.forEach(m => {
    const canvas = document.getElementById(`spark-${m.key}`);
    destroyChart(sparks, m.key);
    if (!canvas) return;
    const entries = data[m.key];
    if (entries.length < 2) return;
    const s = m.summarize(entries);
    const statusColor = cssVar(`--${s.status}`);
    const n = entries.length;

    sparks[m.key] = new Chart(canvas, {
      type: "line",
      data: {
        labels: entries.map(e => e.date),
        datasets: [{
          data: entries.map(m.chartValue),
          borderColor: statusColor,
          backgroundColor: statusColor + "22",
          borderWidth: 1.75,
          tension: 0.35,
          fill: true,
          pointRadius: entries.map((_, i) => i === n - 1 ? 3 : 0),
          pointBackgroundColor: statusColor,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { display: false },
          y: { display: false },
        },
      },
    });
  });
}

function renderAll() {
  renderChartMeta();
  renderSummary();
  renderMetricSections();
  renderCharts();
  renderSparklines();
}

let downloadsPromise = null;
function getDownloadsCapability() {
  if (!downloadsPromise) {
    downloadsPromise = (async () => {
      try {
        if (window.claude && typeof window.claude.use === "function") {
          return await window.claude.use("downloads");
        }
      } catch (e) {}
      return null;
    })();
  }
  return downloadsPromise;
}

function fallbackDownload(filename, text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  const filename = `health-dashboard-${todayStr()}.json`;
  const json = JSON.stringify(data, null, 2);
  const downloads = await getDownloadsCapability();
  if (downloads) {
    try {
      await downloads.save({ filename, data: json });
    } catch (e) {
      if (!e || e.code !== "declined") fallbackDownload(filename, json);
    }
  } else {
    fallbackDownload(filename, json);
  }
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      METRICS.forEach(m => {
        if (Array.isArray(imported[m.key])) data[m.key] = imported[m.key];
      });
      saveData(data);
      renderAll();
    } catch (e) {
      alert("Could not read that file as valid dashboard data.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
});

renderAll();
</script>
